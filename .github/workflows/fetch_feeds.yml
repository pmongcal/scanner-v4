name: Scanner V4 Fetch RSS Feeds

on:
  schedule:
    # 22:37 UTC = 06:37 Manila time (UTC+8)
    - cron: "37 22 * * *"
  workflow_dispatch:
    inputs:
      retest:
        description: "Retest: treat every article as new (ignores seen list, does not save it). Leave unticked for normal runs."
        type: boolean
        default: false

permissions:
  contents: write  # needed to commit the articles.json back to the repo

concurrency:
  group: fetch-feeds
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run aggregator
        env:
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          RETEST: ${{ inputs.retest && '1' || '' }}
        run: python fetch_feeds.py

      - name: Email digest to Gmail
        # Always attempt to email, even if aggregator exited non-zero.
        # Sends everything in pending_digest.json and clears it only on success,
        # so a failed send goes out with the next run instead of being lost.
        if: always()
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
          SMTP_FROM_NAME: ${{ secrets.SMTP_FROM_NAME }}
        run: |
          if [ -z "$SMTP_USER" ] || [ -z "$SMTP_PASSWORD" ] || [ -z "$SMTP_TO" ]; then
            echo "SMTP secrets not configured, skipping email step"
            exit 0
          fi
          python send_email.py

      - name: Commit refreshed data
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles.json articles_archive/ seen_ids.json pending_digest.json audit/ || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "feeds: auto-refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
